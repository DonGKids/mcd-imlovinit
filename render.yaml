services:
  - type: web
    name: mcd-imlovinit-api
    runtime: node
    rootDir: source/server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_ORIGIN
        sync: false
    autoDeploy: true

services:
  - type: web
    name: mcd-imlovinit-api
    runtime: node
    rootDir: source/server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_ORIGIN
        sync: false
      # 麦当劳 MCP（运行时 now-time-info 时段校准）
      - key: MCP_MCP_URL
        value: https://mcp.mcd.cn
      # 在 Render 控制台手动填入，不写入仓库
      - key: MCD_MCP_TOKEN
        sync: false
    autoDeploy: true

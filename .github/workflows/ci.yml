name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
        # 启动并测试 health 接口
      - run: |
          npm start &
          sleep 4
          curl -s http://localhost:4000/api/health | grep '"status":"ok"'
          curl -s -X POST http://localhost:4000/api/recommend \
            -H "Content-Type: application/json" \
            -d '{"ageRange":"young","occupation":"programmer","flavorPrefs":[],"moods":["focus"],"healthFocus":"none","mealTime":"auto","topN":1}' \
            | grep '"success":true'

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
